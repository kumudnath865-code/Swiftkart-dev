<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horlics(SwiftKart)</title>
</head>
<body>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #b2f7eb 0%, #4eb9f2 100%);
    }

    .carousel-container {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding-bottom: 10px;

    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .carousel-container::-webkit-scrollbar {
      display: none;
    }

    .carousel-item {
      flex: 0 0 250px;
      background: none;
      border-radius: 10px;
      overflow: hidden;
      gap: 0px;
    }
    .carousel-item img {
      width: 200px;
      height: 300px;
      margin-left: 10%;
      margin-right: 20%;
      object-fit: cover;
      gap: 2px;
    }
    .carousel-item img:hover {
      border-style: groove;
      border-color: #8df7d2;
      background: #8df7d2;
      border-width: thin;
      /* Horizontal offset | Vertical offset | Blur radius | Spread | Color */
      box-shadow: 0px 9px 90px #8df7d2;

      /* Optional: Smoothly lifts the element slightly */
      transform: translateY(2px);
      transition: all 0.1s ease;
    }
    .details-section {
      padding-left: 15px;
      flex-grow: 10;
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 25px;
      text-transform: uppercase;
      color: #f2e4f8;
      letter-spacing: 0.5px;
    }

    .item-name {
      font-size: 20px;
      color: #f4fff;
      margin: 2px 0;
      font-weight: 600;
    }

    .weight {
      font-size: 23px;
      color: #fff;
      margin-bottom: 8px;
    }

    .price-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .price {
      font-size: 25px;
      font-weight: 700;
      color: #000;
    }

    .mrp {
      font-size: 15px;
      text-decoration: line-through;
      color: grey;
    }

    /* Action Button */
    .add-btn {
      position: static;
      bottom: 10px;
      right: 52px;
    }
    .add-btn1 {
      height: 40px;
      width: 49%;
      justify-content: left;
      background-color: #fff;
      color: #5cd6f7;
      /* Meesho-style pink/red */
      border: 1px solid #5cd6f7;
      padding: 6px 20px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .add-btn2 {
      height: 40px;
      width: 49%;
      justify-content: right;
      background-color: #fff;
      color: #5cd6f7;
      /* Meesho-style pink/red */
      border: 1px solid #5cd6f7;
      padding: 6px 20px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .add-btn1:hover {
      background-color: #fd9925;
      color: #fff;
    }
    .add-btn2:hover {
      background-color: #42d4f5;
      color: #ffff;
    }
  </style>
  <header>
    <div style="padding: 10px;">
      <a href="http://localhost:8158/groceries.html" style="text-decoration: none; color: #000; font-weight: bold;"> ← Back to Groceries</a>
    </div>

    <div class="carousel-container">
      <div class="carousel-item">
        <img src="https://www.jiomart.com/images/product/original/490000219/britannia-bourbon-the-original-chocolate-cream-biscuits-50-g-product-images-o490000219-p490000219-0-202512081645.jpg?im=Resize=(420,420)" alt="image">
      </div>
      <div class="carousel-item">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXwwK-WwumNgEBeDYGH7HPBB7rxgkHqV66aF_NYV8xsQ&s=10" alt="Deal 2">
      </div>
      <div class="carousel-item">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQowSPl7lyNdpwgF4_dBPDuVcOQf4IQJT-v3K4K4hsfQA&s"
        alt="Deal 3">
      </div>
    </div>
  </header>
  <main>
    <div class="details-section">
      <p class="brand-name">
        Horlicks
      </p>
      <h3 class="item-name">Chocolate nutrition milk drink</h3>
      <div class="price-box">
        <span class="price">₹399</span>
        <span class="mrp">₹425</span>
      </div>
      <p class="weight">
        Net weight:1 kg
      </p>
      <div class="add-btn">
        <a href="#">
          <button class="add-btn1">BUY NOW</button>
        </a>
        <a href="http://localhost:8158/Cart.html">
          <button class="add-btn2">ADD TO CART</button>
        </a>
      </div>
    </div>
  </main>
  <footer>

  </footer>
</body>
</html>
