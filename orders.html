<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groceries (SwiftKart)</title>

<style>
/* GENERAL STYLES */
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(
    180deg, 
    #FF9933 33.33%, 
    #FFFFFF 33.33%, 
    #FFFFFF 66.66%, 
    #128807 66.66%
    );
}

/* HEADER */
.head {
  height: 70px;
  background: #0d47a1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.head img {
  height: 55px;
}

SEARCH BAR 
.Nav-bar {
  text-align: center;
  background-color: #1976d2;
  padding: 15px;
  box-shadow: 2px 1px 45px black;
  
  /* Optional: Smoothly lifts the element slightly */
  transform: translateY(2px);
  transition: all 0.2s ease;
}

.sorch {
  /* This is your outer container with the black border */
  height: 60px;            /* Increased slightly for breathing room */
  margin: 40px 30px; 
  border: 2px groove black; 
  display: flex;
  align-items: center;     /* This centers the search bar vertically */
  justify-content: center; /* This keeps the search bar horizontally centered */
    background: linear-gradient(90deg, #ff90cc 0%, #3335ff 100%);
    
}
.sorch:hover{
    box-shadow: 2px 1px 45px black;
  
  /* Optional: Smoothly lifts the element slightly */
  transform: translateY(2px);
  transition: all 0.2s ease;
}
.search {
  height: 40px;
  width: 75%;
  border-radius: 20px;
  border: 1px solid #ccc;  /* A light border makes the input stand out */
  padding-left: 20px;
  outline: none;           /* Prevents double-border when typing */
  
}
.buttonsearch:hover{
 box-shadow: 4px 2px 25.5px white;
  
  /* Optional: Smoothly lifts the element slightly */
  transform: translateY(2px);
  transition: all 0.2s ease;
}
.buttonsearch {
  height: 40px;
  padding: 0 20px;
  border: none;
  background-color: #e0e0e0; 
  color: #333;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
  margin-left: -45px;      /* Pulls button inside the search bar */
  z-index: 1;              /* Ensures button stays on top of the input */
}


/* CATEGORY SECTION */
.cate {
  background-color:;
  padding: 20px 10px;
  border-bottom: 1px solid #ddd;
}

.box {
  padding: 0;
  margin: 0;
  display: flex;
  justify-content: space-evenly;
  list-style: none;
}

.box li {
  text-align: center;
}

.box li a {
  text-decoration: none;
  color: #333;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.box li img {
  width: 50px;
  height: 50px;
  background: #e3f2fd;
  padding: 10px;
  border-radius: 50%;
  margin-bottom: 5px;
  transition: transform 0.2s;
}

.box li img:hover {
  transform: scale(1.1);
  box-shadow: 2px 1px 45px grey;
  
  /* Optional: Smoothly lifts the element slightly */
  transform: translateY(2px);
  transition: all 0.2s ease;
  background-color: white;
  border-radius: 50%;
  height: 50px;
}

.box li span {
  font-size: 12px;
  font-weight: 600;
}

/* HERO SECTION */
.text {
  width: 100%;
  min-height: 250px;
  color: white;
  padding: 20px;
  /*<!-- background-size: cover;
  background-position: center; -->*/
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-sizing: border-box;
}

.deal {
  background-color: rgba(0,0,0,0.6);
  text-align: center;
  padding: 10px;
  border-radius: 5px;
  width: fit-content;
  margin: 0 auto 20px auto;
}
.deal:hover{
  box-shadow: 2px 1px 45px black;
  
  /* Optional: Smoothly lifts the element slightly */
  transform: translateY(2px);
  transition: all 0.2s ease;
}
/* CAROUSEL */
.carousel-container {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding-bottom: 10px;
  
}

/* Hide scrollbar for Chrome, Safari and Opera */
.carousel-container::-webkit-scrollbar {
  display: none;
}

.carousel-item {
  flex: 0 0 250px;
  background: white;
  border-radius: 10px;
  overflow: hidden;
}

.carousel-item img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}
/* FEATURED */
.Featured {
  margin-top: 10px;
  
  padding: 20px 10px;
}
.fee:hover {
  background-color: white;
  border-width: 2px;
  border-style: inset;
  border-color: blue;
  border-radius: 50px;
  
  /* Horizontal offset | Vertical offset | Blur radius | Spread | Color */
  box-shadow: 9px 4px 30px blue;
  
  /* Optional: Smoothly lifts the element slightly */
  transform: translateY(2px);
  transition: all 0.9s ease;
}

.fee {
  text-align: center;
  background: blur;
  padding: 10px;
  margin-bottom: 15px;
  border-radius: 80px;
  color: #0d47a1;
}

/* FOOTER */
.navbarfooter {
  background-color: #1a1a1a;
  padding: 20px ;
}

.navbartext ul {
  list-style: none;
  display: flex;
  justify-content: space-around;
  align-items: center; /* Keeps everything vertically centered */
  padding: 0;
  margin: 0;
}

.lia a {
  text-decoration: none;
  color: #ffca28;
  font-size: 14px;
  display: flex;        /* Essential for centering icons inside the circle */
  align-items: center;
  justify-content: center;
  height: 50px;        /* Move height/width here for a smooth transition */
  width: 50px;
  border-radius: 50%;
  transition: all 0.3s ease;
}

.lia a:hover {
  background-color: darkgrey;
  box-shadow: 0px 0px 20px 5px rgba(255, 255, 255, 0.6); /* Softer white glow */
  
  /* Pushes the icon UP slightly */
  transform: translateY(-5px); 
}
/* Ensure images inside don't break the circle */
.lia a img {
  width: 25px;
  height: 25px;
  object-fit: contain;
  border-radius: 50%;
}
</style>
</head>

<body>

<header>
  <div class="head">
    <img src="https://via.placeholder.com/150x55?text=SwiftKart" alt="SwiftKart Logo">
  </div>
  <div class="Nav-bar">
    <div class="sorch">
    <input type="text" class="search" placeholder="Search for groceries...">
    <button class="buttonsearch">Search</button>
  </div>
</div>
</header>
<main>
<div class="cate">
  <ul class="box">
    <li>
      <a href="#">
        <img src="https://cdn-icons-png.flaticon.com/512/2329/2329813.png" alt="Veg">
        <span>Veggie</span>
      </a>
    </li>
    <li>
      <a href="#">
        <img src="https://cdn-icons-png.flaticon.com/512/3194/3194591.png" alt="Rice">
        <span>Grains</span>
      </a>
    </li>
    <li>
      <a href="#">
        <img src="https://cdn-icons-png.flaticon.com/512/3050/3050162.png" alt="Dairy">
        <span>Dairy</span>
      </a>
    </li>
    <li>
      <a href="#">
        <img src="https://cdn-icons-png.flaticon.com/512/2907/2907321.png" alt="Fruits">
        <span>Fruits</span>
      </a>
    </li>
  </ul>
</div>   
  
<div class="text">
  <h3 class="deal">Today's Best Deals</h3>

  <div class="carousel-container">
    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c" alt="Deal 1">
    </div>
    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1606787366850-de6330128bfc" alt="Deal 2">
    </div>
    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1567306226416-28f0efdc88ce"
      alt="Deal 3">
    </div>
  </div>
</div>

<div class="Featured">
  <h3 class="fee">⭐ Featured Items</h3>

  <div class="carousel-container">
    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1506619216599-9d16d0903dfd" alt="Featured 1">
    </div>
    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1613145993483-6c9d9f70906b" alt="Featured 2">
    </div>
    <div class="carousel-item">
      <img src=" https://images.unsplash.com/photo-1598514982841-7d2c1c7f3e4b" alt="Featured 3">
    </div>
  </div>
</div>

</main>

<footer>
  <div class="navbarfooter">
    <nav class="navbartext">
      <ul>
       <li class="lia"><a href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIifF9GgvosnzUjrNbaEdRKrfdSXeJb3AVIvEqqmftLw&s=10" alt="FOOD"></a></li>
        <li class="lia"><a href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTTaIOyq3AWzuvn8S6iOrGFZ1Jnv1AD_hRwaFgq1qV-Rw&s=10" alt="GROCERIES"></a></li>
       <li class="lia"><a href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSf-JMvr3Uh9DTltPNMHu83lnVTq86Lq2IdIZbq-BMBNw&s=10" alt="HOME"></a></li>
        <li class="lia"><a href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbxXVu7mGdIJJRr-Em0fG6TOXqomec17mzzjTPtllZQ9wl9Ypo3zygIY0&s=10" alt="ACCESSORIES"></a></li>
       <li class="lia"><a href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTrRfHJty5oxy8Lcc8YThpGKHkpFCEe01kS7ylGVxMaoQ&s=10" alt="SETTING"></a></li>
      </ul>
    </nav>
  </div>
</footer>

</body>
</html>
