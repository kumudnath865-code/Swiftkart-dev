<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swift Kart</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background: linear-gradient(180deg,#b2f7eb,#4eb9f2);
  padding-bottom:80px;
}

/* HEADER */
.head{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  height:70px;
}

.head img{
  height:50px;
  border-radius:50%;
}

.head p{
  font-weight:bold;
}

/* SEARCH */
.Nav-bar{
  background:#1976d2;
  padding:10px;
}

.sorch{
  display:flex;
  justify-content:center;
  padding:10px;
}

.search{
  width:70%;
  max-width:400px;
  height:40px;
  border-radius:20px;
  border:none;
  padding-left:10px;
}

.buttonsearch{
  height:40px;
  border:none;
  padding:0 15px;
  border-radius:20px;
  margin-left:-40px;
}

/* CATEGORIES */
.categories ul{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  list-style:none;
  padding:10px;
}

.categories a{
  background:white;
  padding:5px 10px;
  border-radius:10px;
  text-decoration:none;
  color:black;
}

/* PRODUCTS */
.main{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
  padding:10px;
}

.ad-card{
  height:130px;
  background:white;
  border-radius:10px;
  overflow:hidden;
}

.ad-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* FOOTER */
.navbarfooter{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
}

.navbartext ul{
  display:flex;
  justify-content:space-around;
  padding:10px;
  list-style:none;
}

.navbartext img{
  width:25px;
}

/* CENTER BUTTON */
.liam img{
  width:30px;
}
</style>
</head>

<body>

<header>
  <div class="head">
    <img src="https://image2url.com/r2/default/images/1775795696466-c055581b-e5e5-4386-8fe8-043853054e4c.jpg">
    <p>SwiftKart.com</p>
  </div>

  <div class="Nav-bar">
    <div class="sorch">
      <input type="text" class="search" placeholder="Search for groceries...">
      <button class="buttonsearch">Search</button>
    </div>
  </div>
</header>

<div class="categories">
  <ul>
    <li><a href="#">Electronics</a></li>
    <li><a href="#">Stationary</a></li>
    <li><a href="#">Smartphones</a></li>
    <li><a href="#">Watches</a></li>
  </ul>
</div>

<main class="main">

  <div class="ad-card">
    <a href="c000003.html">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGuQt4B0GVwQANca8STyavTDVj3-y7P-chLLwSMNJv0w&s=10">
    </a>
  </div>

  <div class="ad-card">
    <img src="https://via.placeholder.com/150">
  </div>

  <div class="ad-card">
    <img src="https://via.placeholder.com/150">
  </div>

</main>

<footer>
<div class="navbarfooter">
<nav class="navbartext">
<ul>
<li><a href="food.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIifF9GgvosnzUjrNbaEdRKrfdSXeJb3AVIvEqqmftLw&s=10"></a></li>
<li><a href="groceries.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTTaIOyq3AWzuvn8S6iOrGFZ1Jnv1AD_hRwaFgq1qV-Rw&s=10"></a></li>
<li class="liam"><a href="home.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSf-JMvr3Uh9DTltPNMHu83lnVTq86Lq2IdIZbq-BMBNw&s=10"></a></li>
</ul>
</nav>
</div>
</footer>

</body>
</html>
