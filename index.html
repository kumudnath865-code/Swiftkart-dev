<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swift Kart</title>

  <link rel="stylesheet" href="css/styleh.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}

    /* Layout grid: header top, main center, sidebar right */
     body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #b2f7eb 0%, #4eb9f2 100%);
    }

    /* HEADER */
    .head {
      height: 70px;
      background: linear-gradient(90deg, #b2f7eb, #4eb9f2, #b2f7eb);
      color:transparent;
     
    }

    .head img {
      margin-left: 45%;
      justify-content: right;
      height: 55px;
      border-radius: 50%;
    }
    .head :hover {
      color:black;
      border-radius: 20px;
      text-align: center;
      box-shadow: 2px 1px 5px #2c3132;

      /* Optional: S moothly lifts the element slightly */
      transform: translateY(2px);
      transition: all 0.1s ease;
      transform: none;
    }
.sEARCH BAR
    .Nav-bar {
      text-align: center;
      background-color: #1976d2;
      padding: 15px;
      box-shadow: 2px 1px 45px black;

      /* Optional: Smoothly lifts the element slightly */
      transform: translateY(2px);
      transition: all 0.2s ease;
    }

    .sorch {
      /* This is your outer container with the black border */
      height: 60px;
      /* Increased slightly for breathing room */
      margin: 50px 10px;
      border: 2px groove black;
      display: flex;
      align-items: center;
      /* This centers the search bar vertically */
      justify-content: center;
      /* This keeps the search bar horizontally centered */
      background: linear-gradient(90deg,#31ffff 0%, #ff90cc 100%);

    }
    .sorch:hover {
      background-color: white;
      box-shadow: 2px 1px 45px white;

      /* Optional: Smoothly lifts the element slightly */
      transform: translateY(2px);
      transition: all 0.2s ease;
      background-color: white;
    }
    .search {
      height: 40px;
      width: 75%;
      border-radius: 20px;
      border: 1px solid #ccc;
      /* A light border makes the input stand out */
      padding-left: 20px;
      outline: none;
      /* Prevents double-border when typing */

    }
    .buttonsearch:hover {
      box-shadow: 4px 2px 25.5px white;

      /* Optional: Smoothly lifts the element slightly */
      transform: translateY(2px);
      transition: all 0.2s ease;
    }
    .buttonsearch {
      height: 40px;
      padding: 0 20px;
      border: none;
      background-color: #e0e0e0;
      color: #333;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      margin-left: -45px;
      /* Pulls button inside the search bar */
      z-index: 1;
      /* Ensures button stays on top of the input */
    }



    .logo img{
      height:32px;
      width:auto;
    }

    .right-nav{
      flex:1;
      display:flex;
    }

    #search{
      flex:1;
      padding:6px 8px;
      border:1px solid #ccc;
      border-radius:4px 0 0 4px;
    }
    .btn-search{
      padding:6px 10px;
      border:1px solid #ccc;
      border-left:none;
      background:#ffce32;
      cursor:pointer;
      border-radius:0 4px 4px 0;
    }

    /* Categories row */
    .categories{
      margin-top:6px;
      width:100%;
    }
    .categories ul{
      list-style:none;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      font-size:0.85rem;
    }
    .categories a{
      text-decoration:none;
      padding:4px 8px;
      border-radius:12px;
      background:#ffffff;
      border:1px solid #ddd;
      color:#333;
    }

    /* Main center area with ads / cards */
    .main{
      grid-area:main;
      padding:12px;
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap:10px;
      align-content:start;
    }
    .ad-card{
      background:#fff;
      border:1px solid #ddd;
      border-radius:6px;
      height:130px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .ad-card img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .section-title{
      grid-column:1 / -1;
      font-size:0.95rem;
      margin:4px 0;
    }

    /* Right sidebar with icons */
    .sidebar-wrapper{
      grid-area:sidebar;
      width:60px;
      background:#ffffff;
      border-left:1px solid #ddd;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:10px 0;
      position:sticky;
      top:0;
      height:100vh;
    }
    .sidebar_list{
      list-style:none;
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .sidebar_item a{
      display:block;
      width:32px;
      height:32px;
      border-radius:8px;
      background:#f5f5f5;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:0.9rem;
      text-decoration:none;
      color:#333;
    }

    /* Mobile: move sidebar to bottom */
    @media (max-width:768px){
      body{
        grid-template-columns:1fr;
        grid-template-rows:auto 1fr 56px;
        grid-template-areas:
          "header"
          "main"
          "sidebar";
      }
      .sidebar-wrapper{
        flex-direction:row;
        justify-content:space-around;
        border-left:none;
        border-top:1px solid #ddd;
        width:100%;
        height:56px;
      }
      .sidebar_list{
        flex-direction:row;
        margin-top:0;
      
    }
    .navbarfooter {
      background-color: #1a1a1a;
      padding: 20px;
    }

    .navbartext ul {
      list-style: none;
      display: flex;
      justify-content: space-around;
      align-items: center;
      /* Keeps everything vertically centered */
      padding: 0;
      margin: 0;
    }

    .lia a {
      text-decoration: none;
      color: #ffca28;
      font-size: 120px;
      display: flex;
      /* Essential for centering icons inside the circle */
      align-items: center;
      justify-content: center;
      height: 50px;
      /* Move height/width here for a smooth transition */
      width: 50px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .lia a:hover {
      background-color: darkgrey;
      box-shadow: 0px 0px 20px 5px rgba(255, 255, 255, 0.6);
      /* Softer white glow */

      /* Pushes the icon UP slightly */
      transform: translateY(-5px);
    }
    /* Ensure images inside don't break the circle */
    .lia a img {
      width: 25px;
      height: 25px;
      object-fit: contain;
      border-radius: 30%;
    }
    .liam a{
      text-decoration: circle;
      color: #ffca28;
      font-size: 10px;
      display: flex;
      /* Essential for centering icons inside the circle */
      align-items: center;
      justify-content: center;
      height: 60px;
      /* Move height/width here for a smooth transition */
      width: 60px;
      border-radius: 80%;
      background-color:  #ffca28;
      box-shadow: 1px 1px 20px 10px hsl(200,13%,95.5%);
      /* Softer white glow */

      /* Pushes the icon UP slightly */
      transform: translateY(0px);
    }
    .liam a img{
      width: 35px;
      height: 35px;
      object-fit: contain;
      border-radius: 30%;
    }
  </style>
</head>
