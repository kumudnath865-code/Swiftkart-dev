<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swift Kart</title>

<link rel="stylesheet" href="css/styleh.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}

body {
  background: linear-gradient(180deg,#b2f7eb,#4eb9f2);
  overflow-x:hidden;
  padding-bottom:80px;
}

/* HEADER FIX */
.head {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  height:70px;
}

.head img {
  height:55px;
  border-radius:50%;
}

.head p{
  color:black;
  font-weight:bold;
}

/* SEARCH BAR */
.Nav-bar {
  text-align:center;
  background:#1976d2;
  padding:15px;
}

.sorch {
  height:60px;
  margin:10px;
  border:2px groove black;
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(90deg,#31ffff,#ff90cc);
}

.search {
  height:40px;
  width:75%;
  border-radius:20px;
  border:1px solid #ccc;
  padding-left:20px;
}

.buttonsearch {
  height:40px;
  padding:0 20px;
  border:none;
  border-radius:20px;
  margin-left:-45px;
}

/* CATEGORIES */
.categories ul{
  list-style:none;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  padding:10px;
}

.categories a{
  text-decoration:none;
  padding:4px 8px;
  border-radius:12px;
  background:#ffffff;
  border:1px solid #ddd;
  color:#333;
}

/* MAIN */
.main{
  padding:12px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
}

.ad-card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:6px;
  height:130px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.ad-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* FOOTER FIX ONLY */
.navbarfooter {
  position:fixed;
  bottom:0;
  width:100%;
  background-color:#1a1a1a;
  padding:10px 0;
}

.navbartext ul {
  list-style:none;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.lia a, .liam a {
  display:flex;
  align-items:center;
  justify-content:center;
}

.lia a img {
  width:25px;
  height:25px;
}

.liam a img{
  width:35px;
  height:35px;
}
</style>
</head>

<body>

<header>
  <div class="head">
    <a href="#">
      <img src="https://image2url.com/r2/default/images/1775795696466-c055581b-e5e5-4386-8fe8-043853054e4c.jpg">
      <p>SwiftKart.com</p>
    </a>
  </div>

  <div class="Nav-bar">
    <div class="sorch">
      <input type="text" class="search" placeholder="Search for groceries...">
      <button class="buttonsearch">Search</button>
    </div>
  </div>
</header>

<div class="categories">
  <ul>
    <li><a href="#electronics">Electronics</a></li>
    <li><a href="#stationary">Stationary</a></li>
    <li><a href="#smartphones">Smartphones</a></li>
    <li><a href="#watches">Watches</a></li>
    <li><a href="#new">New arrivals</a></li>
    <li><a href="#trend">Trend</a></li>
  </ul>
</div>

<main class="main">
  <h4>New arrivals</h4>

  <!-- ONLY CHANGE: removed localhost -->
  <div class="ad-card">
    <a href="c000003.html">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGuQt4B0GVwQANca8STyavTDVj3-y7P-chLLwSMNJv0w&s=10">
    </a>
  </div>

  <!-- ONLY CHANGE: content:// replaced -->
  <div class="ad-card">
    <img src="https://via.placeholder.com/150">
  </div>

  <div class="ad-card"><img src=""></div>
  <div class="ad-card"><img src=""></div>
  <div class="ad-card"><img src=""></div>
</main>

<footer>
<div class="navbarfooter">
<nav class="navbartext">
<ul>
<li class="lia"><a href="food.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIifF9GgvosnzUjrNbaEdRKrfdSXeJb3AVIvEqqmftLw&s=10"></a></li>
<li class="lia"><a href="groceries.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTTaIOyq3AWzuvn8S6iOrGFZ1Jnv1AD_hRwaFgq1qV-Rw&s=10"></a></li>
<li class="liam"><a href="home.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSf-JMvr3Uh9DTltPNMHu83lnVTq86Lq2IdIZbq-BMBNw&s=10"></a></li>
<li class="lia"><a href="maintain.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbxXVu7mGdIJJRr-Em0fG6TOXqomec17mzzjTPtllZQ9wl9Ypo3zygIY0&s=10"></a></li>
<li class="lia"><a href="setting.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTrRfHJty5oxy8Lcc8YThpGKHkpFCEe01kS7ylGVxMaoQ&s=10"></a></li>
</ul>
</nav>
</div>
</footer>

</body>
</html>
