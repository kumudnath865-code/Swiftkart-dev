<style>

        body {
    background-color: #F0F2F2;
    font-family: 'Arial', sans-serif;
    color: #0F1111;
}

.cart-container {
    display: flex;
    max-width: 1200px;
    margin: 20px auto;
    gap: 20px;
}

.cart-main {
    flex: 3;
    background: white;
    padding: 20px;
}

.cart-sidebar {
    flex: 1;
    background: white;
    padding: 20px;
    height: fit-content;
}

.cart-item {
    display: flex;
    padding: 15px 0;
    border-bottom: 1px solid #DDD;
}

.item-img img { width: 150px; height: auto; }

.item-details { flex: 2; padding: 0 20px; }

.stock-status { color: #007600; font-size: 12px; }

.qty-dropdown {
    background: #F0F2F2;
    border-radius: 8px;
    border: 1px solid #D5D9D9;
    padding: 5px;
    box-shadow: 0 2px 5px rgba(15,17,17,.15);
}

.text-btn {
    background: none;
    border: none;
    color: #007185;
    cursor: pointer;
    font-size: 12px;
}

.text-btn:hover { text-decoration: underline; color: #C7511F; }

.checkout-btn {
    background-color: #FF9900; /* Swift Orange */
    border: none;
    border-radius: 20px;
    width: 100%;
    padding: 10px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.checkout-btn:hover { background-color: #FFB33E; }

    
</style>
