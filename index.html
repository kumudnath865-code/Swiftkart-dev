  <style>
  *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background: linear-gradient(180deg,#b2f7eb ,#4eb9f2 );
  overflow-x:hidden;
  padding-bottom:80px; /* space for footer */
}

/* HEADER / NAVBAR */
.head{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  height:70px;
}

.head img{
  height:50px;
  border-radius:50%;
}

.head p{
  font-weight:bold;
  color:black;
}

/* SEARCH BAR */
.Nav-bar{
  background:#1976d2;
  padding:12px;
}

.sorch{
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(90deg,#31ffff,#ff90cc);
  padding:10px;
  border-radius:10px;
}

.search{
  width:100%;
  max-width:500px;
  height:40px;
  border-radius:20px;
  border:none;
  padding-left:15px;
}

.buttonsearch{
  height:40px;
  padding:0 15px;
  border:none;
  background:#e0e0e0;
  border-radius:20px;
  margin-left:-40px;
  cursor:pointer;
}

/* CATEGORIES */
.categories{
  padding:10px;
}

.categories ul{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  list-style:none;
}

.categories a{
  text-decoration:none;
  background:#fff;
  padding:6px 12px;
  border-radius:15px;
  border:1px solid #ddd;
  font-size:14px;
  color:#333;
}

/* MAIN PRODUCTS */
.main{
  padding:10px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
}

.section-title{
  grid-column:1/-1;
  font-size:16px;
  font-weight:bold;
}

/* PRODUCT CARDS */
.ad-card{
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ad-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* FOOTER NAVBAR */
.navbarfooter{
  position:fixed;
  bottom:0;
  width:100%;
  background:#1a1a1a;
  padding:8px 0;
  z-index:1000;
}

.navbartext ul{
  display:flex;
  justify-content:space-around;
  align-items:center;
  list-style:none;
}

/* NORMAL ICON */
.lia a{
  display:flex;
  align-items:center;
  justify-content:center;
  height:45px;
  width:45px;
  border-radius:50%;
  transition:0.3s;
}

.lia a:hover{
  background:#333;
  transform:translateY(-3px);
}

.lia img{
  width:22px;
  height:22px;
}

/* CENTER ICON (HOME) */
.liam a{
  display:flex;
  align-items:center;
  justify-content:center;
  height:55px;
  width:55px;
  border-radius:50%;
  background:#ffca28;
  box-shadow:0 0 15px rgba(255,255,255,0.6);
  transform:translateY(-10px);
}

.liam img{
  width:28px;
  height:28px;
}

/* MOBILE OPTIMIZATION */
@media(max-width:768px){
  .search{
    max-width:90%;
  }

  .head{
    flex-direction:row;
  }

  .categories a{
    font-size:12px;
  }
}

/* 🔥 HOVER EFFECTS ADDED BELOW (ONLY ADDITION) */

.head a:hover{
  transform:scale(1.05);
  transition:0.3s;
}

.sorch:hover{
  box-shadow:0px 0px 20px rgba(255,255,255,0.8);
  transition:0.3s;
}

.buttonsearch:hover{
  background:#ccc;
  transform:scale(1.05);
  transition:0.3s;
}

.categories a:hover{
  background:#ffca28;
  color:black;
  transform:translateY(-3px);
  transition:0.3s;
}

.ad-card:hover{
  transform:scale(1.05);
  box-shadow:0px 5px 20px rgba(0,0,0,0.3);
  transition:0.3s;
}

.liam a:hover{
  transform:translateY(-12px) scale(1.1);
  box-shadow:0px 0px 20px rgba(255,255,255,0.8);
  transition:0.3s;
}

</style>
</head>
